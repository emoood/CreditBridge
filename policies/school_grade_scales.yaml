# Grade scales used ONLY to cross-check printed school transcripts (mark -> letter -> grade points).
# These are assumptions for the demo, NOT any school's official scale. A mismatch only raises a flag for the officer.
default: synthetic_us_4_0
scales:
  synthetic_us_4_0:
    label: "Synthetic US-style 4.0 scale (demo assumption, unverified)"
    bands:   # min_mark, letter, grade_points
      - [93, "A", 4.0]
      - [90, "A-", 3.7]
      - [87, "B+", 3.3]
      - [83, "B", 3.0]
      - [80, "B-", 2.7]
      - [77, "C+", 2.3]
      - [73, "C", 2.0]
      - [70, "C-", 1.7]
      - [67, "D+", 1.3]
      - [65, "D", 1.0]
      - [0, "F", 0.0]
  demo_valley:   # the scale printed on the Demo Valley International School transcript (transcript D)
    label: "Grading scale of Demo Valley International School (as printed)"
    bands:
      - [97, "A+", 4.0]
      - [93, "A", 4.0]
      - [90, "A-", 3.7]
      - [87, "B+", 3.3]
      - [83, "B", 3.0]
      - [80, "B-", 2.7]
      - [77, "C+", 2.3]
      - [73, "C", 2.0]
      - [70, "C-", 1.7]
      - [67, "D+", 1.3]
      - [65, "D", 1.0]
      - [60, "D-", 0.5]
      - [0, "F", 0.0]
