[project]
name = "creditbridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "pydantic-settings>=2.6",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "httpx>=0.27",
  "pymupdf>=1.24", "reportlab>=4.2", "scikit-learn>=1.5", "pyyaml>=6",
  "pytesseract>=0.3", "pillow>=10", "arabic-reshaper>=3", "python-bidi>=0.6", "python-multipart>=0.0.12",
  "google-genai>=2.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
