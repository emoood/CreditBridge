bq_elective:
  count: 1
  rule: One extra course from any Big Questions category.
  eligible_categories:
  - BQ-TECH
  - BQ-IMAG
  - BQ-CULT
  - BQ-ETHI
  - BQ-SCIE
exclusions:
- courses:
  - SCIE 201
  - BIOL 201
  - BIOL 202
  rule: Credit is allowed for SCIE 201 or one of BIOL 201/BIOL 202, but not for both SCIE 201 and either
    BIOL course.
  raw: '*Students are prohibited from earning credit for both SCIE 201 and BIOL 201 or BIOL 202'
